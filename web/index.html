<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人工呼吸器シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  /* ============================================================
     テーマは 2 つ。data-theme="pop"（既定）と "device"（実機風）。
     配色・角・影はすべて下のトークンで持ち、構造の CSS は共通にする。
     キャンバス（波形・ループ・トレンド・ダイヤル）は app.js が
     これらのカスタムプロパティを読んで同じ色で描く。
     ============================================================ */
  :root{
    --num:"Barlow Semi Condensed","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
    --jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }

  /* ---------------- ポップ（既定） ---------------- */
  :root, :root[data-theme="pop"]{
    color-scheme: light;
    /* 筐体 */
    --body:#FFF3E4;
    --deck:linear-gradient(168deg,#FFEFD6 0%,#FFE0EC 46%,#E3ECFF 100%);
    --bar:#FFFFFF;
    --panel:#FFFFFF;
    --panel2:#FFF8EE;
    --br:#F0DFD0;
    --br2:#E4D3EA;
    --ink:#262745;
    --dim:#767898;
    --faint:#A4A6C2;
    --shadow:0 2px 0 rgba(90,60,110,.10), 0 6px 16px rgba(120,80,140,.10);
    --r-s:9px; --r-m:14px; --r-l:20px;
    /* アクセント */
    --accent:#FF5E8A;        /* 主アクセント（確定・進む） */
    --accent-ink:#FFFFFF;
    --accent2:#5B7CFA;       /* シミュレーター操作 */
    --accent3:#12C48B;       /* 正常・達成 */
    --brand1:#FF5E8A; --brand2:#FFB020; --brand3:#12C48B; --brand4:#5B7CFA;
    /* 計測の色（画面とキャンバス共通） */
    --paw:#FFC53D; --paw-dim:#C2901F;
    --flow:#3BEFC0;
    --vol:#A6B8FF;
    --spo2:#5FE1F5;
    --crit:#FF5570; --warn:#FFAF2E; --good:#2BD9A0;
    /* キー */
    --key:#FFFFFF; --key-br:#EBDCCF; --key-ink:#3A3B5C; --key-lip:#E3D0C0;
    --key-on:#FFF0F4; --key-on-br:var(--accent); --key-on-ink:#C93062;
    --hkey:#FFFFFF; --hkey-br:#E7DACC;
    /* 機器の画面（暗いまま。波形の読みやすさを落とさない） */
    --screen:#191E4C;
    --screen-frame:#FFFFFF;
    --tile:#232A66; --tile-line:#313A83; --screen-ink:#F0F2FF; --screen-dim:#A7B0EA;
    --scope-bg:#141849;
    --scope-grid:#232A70; --scope-grid2:#2C3585;
    --scope-zero:#3A44A0; --scope-peep:#2F8F6E;
    --scope-axis:#8E97DC; --scope-label:#CDD4FF; --scope-faint:#7B84CC;
    --scope-cursor:255,255,255;
    --scope-glow:7;
    --knob-track:#EADCCF; --knob-ptr:#3A3B5C; --knob-tick:#D9C8B8;
    --knob-face:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#FFF2E2 46%,#FFE2CD 78%,#F3CDB4 100%);
    /* 学習帯 */
    --chap:#5B7CFA;
    --coach-ink:#2A2B4A;
    --modal-back:rgba(50,30,60,.42);
  }
  /* 章ごとの色分け */
  [data-chap="ch1"]{--chap:#4FA8FF} [data-chap="ch2"]{--chap:#12C48B}
  [data-chap="ch3"]{--chap:#8B6BFF} [data-chap="ch4"]{--chap:#FF5E8A}
  [data-chap="ch5"]{--chap:#FF8A3D} [data-chap="ch6"]{--chap:#F0A800}

  /* ---------------- 実機風 ---------------- */
  :root[data-theme="device"]{
    color-scheme: dark;
    --body:#0E1114;
    --deck:linear-gradient(180deg,#1A1E23 0%,#12161A 46%,#0C0F12 100%);
    --bar:#15181C;
    --panel:#0F1318;
    --panel2:#12161B;
    --br:#22303D;
    --br2:#22303D;
    --ink:#DCE6F0;
    --dim:#7E8EA0;
    --faint:#4A5765;
    --shadow:0 1px 0 #000;
    --r-s:3px; --r-m:4px; --r-l:6px;
    --accent:#2FD8A8; --accent-ink:#04120D;
    --accent2:#8FA8FF; --accent3:#3ECB80;
    --brand1:#9FB0C2; --brand2:#9FB0C2; --brand3:#9FB0C2; --brand4:#9FB0C2;
    --paw:#F5B429; --paw-dim:#B98514;
    --flow:#2FD8A8; --vol:#8FA8FF; --spo2:#59D8EA;
    --crit:#FF4B57; --warn:#FFB03A; --good:#3ECB80;
    --key:#1B2027; --key-br:#0A0E12; --key-ink:#C3D0DC; --key-lip:#2B343E;
    --key-on:#27303A; --key-on-br:#2FD8A8; --key-on-ink:#2FD8A8;
    --hkey:#1B2027; --hkey-br:#0A0E12;
    --screen:#04070A;
    --screen-frame:#0A1219;
    --tile:#080C11; --tile-line:#16202A; --screen-ink:#DCE6F0; --screen-dim:#7E8EA0;
    --scope-bg:#04070A;
    --scope-grid:#0E1A24; --scope-grid2:#101C26;
    --scope-zero:#1B2A36; --scope-peep:#2E4A2E;
    --scope-axis:#4A5765; --scope-label:#9FB0C2; --scope-faint:#39485A;
    --scope-cursor:200,230,255;
    --scope-glow:0;
    --knob-track:#1B2530; --knob-ptr:#C8D6E4; --knob-tick:#2A3542;
    --knob-face:radial-gradient(circle at 34% 28%,#39434E 0%,#222A33 42%,#141A20 72%,#0B0F13 100%);
    --chap:#2FD8A8;
    --coach-ink:#DCEFE7;
    --modal-back:rgba(2,4,6,.6);
    --jp:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  :root[data-theme="device"] [data-chap]{--chap:#2FD8A8}
  :root[data-theme="device"] .coach{background:linear-gradient(180deg,#0D1A17,#0B1512)}
  :root[data-theme="device"] .pkey,:root[data-theme="device"] .hkey{box-shadow:0 1px 0 var(--key-lip) inset}
  :root[data-theme="device"] .pkey:active,:root[data-theme="device"] .hkey:active{transform:none}
  :root[data-theme="device"] .brand b{color:#9FB0C2;background:none;-webkit-background-clip:initial;-webkit-text-fill-color:initial}

  /* ============ 共通 ============ */
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--body);color:var(--ink);font-family:var(--jp);font-size:13px;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
  .cap{font-family:var(--num);font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:500}

  #device{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto auto auto;
    background:var(--deck);
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  /* ---- ステータスバー ---- */
  .status{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--bar);
    border-bottom:1px solid var(--br);min-height:38px}
  .brand{display:flex;align-items:baseline;gap:6px;flex:none}
  .brand b{font-family:var(--jp);font-size:15px;letter-spacing:.02em;font-weight:800;
    background:linear-gradient(92deg,var(--brand1),var(--brand2) 42%,var(--brand3) 74%,var(--brand4));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand i{font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--faint);font-family:var(--num);font-weight:600}
  .pt{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
  .alarm{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;
    background:var(--panel2);border:1.5px solid var(--br);font-size:12.5px;
    color:var(--dim);overflow:hidden;white-space:nowrap;font-weight:500}
  .alarm.s1{background:#FFF3DA;border-color:#FFC85C;color:#9A6400}
  .alarm.s2{background:#FFE7EC;border-color:#FF7A92;color:#C3123E;animation:beat 1s steps(1,end) infinite}
  :root[data-theme="device"] .alarm{background:#0C1116;border-color:#22303D;font-family:var(--num);letter-spacing:.04em}
  :root[data-theme="device"] .alarm.s1{background:#241B07;border-color:#6A5217;color:#FFCD6B}
  :root[data-theme="device"] .alarm.s2{background:#2A0C11;border-color:#7E2028;color:#FF98A1}
  .alarm.muted{opacity:.55;animation:none}
  @keyframes beat{0%,49%{filter:brightness(1)}50%,100%{filter:brightness(1.6)}}
  @media (prefers-reduced-motion:reduce){.alarm.s2{animation:none}}
  .led{width:9px;height:9px;border-radius:50%;flex:none;background:#D9D2E4;box-shadow:inset 0 0 2px rgba(0,0,0,.2)}
  :root[data-theme="device"] .led{background:#243040;box-shadow:inset 0 0 2px #000}
  .led.on{background:var(--good);box-shadow:0 0 7px var(--good)}
  .led.s1{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .led.s2{background:var(--crit);box-shadow:0 0 9px var(--crit)}
  .clk{font-family:var(--num);font-size:16px;font-weight:700;color:var(--dim);flex:none}
  @media(max-width:620px){.clk{display:none}.brand i{display:none}.pt{max-width:16vw}
    .val .v{font-size:21px}.hint{display:none}
    .status{gap:6px;padding:5px 7px}
    .brand b{font-size:14px}}
  @media(max-width:430px){.pt{display:none}}
  .chip{flex:none;padding:5px 11px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--br);
    font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap}
  @media(max-width:620px){.chip{padding:5px 8px;font-size:11px}}
  .chip:active{transform:translateY(1px)}
  .chip.on{background:#FFF3DA;border-color:#FFC85C;color:#9A6400}
  :root[data-theme="device"] .chip{background:var(--key);border-color:var(--br);color:#B9C6D2;
    font-family:var(--num);letter-spacing:.06em;font-weight:500}
  :root[data-theme="device"] .chip.on{background:#2A2413;border-color:#6A5217;color:#FFCD6B}
  .chip.theme{color:var(--accent2);border-color:var(--accent2)}
  :root[data-theme="device"] .chip.theme{color:var(--accent2);border-color:#2A3A55}

  /* ---- 画面 ---- */
  .screen{margin:8px;border-radius:var(--r-l);background:var(--screen);position:relative;
    border:3px solid var(--screen-frame);box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.05);
    display:grid;grid-template-columns:minmax(0,1fr) 222px;min-height:0;overflow:hidden}
  :root[data-theme="device"] .screen{margin:6px;border-width:1px}
  @media(max-width:860px){.screen{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
  .scopewrap{position:relative;min-width:0;min-height:0}
  .scopewrap canvas{display:block;width:100%;height:100%}
  .freeze{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:700;letter-spacing:.06em;
    color:#3B2A00;background:var(--paw);padding:3px 10px;border-radius:999px}

  .vals{border-left:2px solid var(--tile-line);display:grid;grid-template-columns:1fr 1fr;
    grid-auto-rows:minmax(54px,1fr);gap:2px;background:var(--tile-line);overflow:auto;min-height:0}
  @media(max-width:860px){
    .vals{border-left:none;border-top:2px solid var(--tile-line);grid-template-columns:repeat(4,minmax(86px,1fr));
      overflow-x:auto;grid-auto-flow:column;grid-auto-columns:minmax(84px,1fr);grid-template-rows:1fr 1fr;height:128px}
  }
  .val{background:var(--tile);padding:5px 8px 6px;min-width:0;position:relative;color:var(--screen-ink)}
  .val .k{font-size:10px;letter-spacing:.02em;color:var(--screen-dim);white-space:nowrap;font-weight:600}
  .val .v{font-family:var(--num);font-size:clamp(19px,3.4vh,27px);font-weight:700;line-height:1.08;
    font-variant-numeric:tabular-nums}
  .val .u{font-size:8.5px;color:var(--screen-dim);font-family:var(--num);margin-left:2px;opacity:.85}
  .val .lim{position:absolute;right:7px;top:5px;font-family:var(--num);font-size:9px;color:var(--screen-dim);
    text-align:right;line-height:1.15;opacity:.8}
  .val.hi .v{color:var(--crit)} .val.mid .v{color:var(--warn)} .val.ok .v{color:var(--good)}
  .val.hi{box-shadow:inset 0 0 0 2px var(--crit)}
  :root[data-theme="device"] .val.hi{box-shadow:none}

  /* ---- 学習コースの帯 ---- */
  .coach{background:linear-gradient(180deg,#FFFFFF,var(--panel2));border-top:3px solid var(--chap);
    border-bottom:1px solid var(--br);flex:none;color:var(--coach-ink);position:relative}
  .cbar{display:flex;align-items:center;gap:8px;padding:5px 9px 3px}
  .cbar .ct{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;overflow:hidden}
  .cbar .ct b{font-size:12.5px;font-weight:800;color:var(--coach-ink);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-width:0;flex:1}
  .cbar .ct i{font-style:normal;font-size:10px;font-weight:700;color:#fff;background:var(--chap);
    padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
  :root[data-theme="device"] .cbar .ct i{background:none;color:#4C7566;padding:0}
  :root[data-theme="device"] .cbar .ct b{color:#A8E6CE}
  .cdots{display:flex;gap:4px;flex:none}
  .cdots span{width:8px;height:8px;border-radius:50%;background:var(--br);transition:transform .15s}
  .cdots span.on{background:var(--chap)}
  .cdots span.cur{background:var(--paw);box-shadow:0 0 0 3px rgba(255,197,61,.28);transform:scale(1.15)}
  .cbtn{flex:none;padding:4px 11px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--br);
    font-size:11.5px;font-weight:700;color:var(--dim)}
  .cbtn:active{transform:translateY(1px)}
  .cbtn.go{background:var(--chap);border-color:var(--chap);color:#fff}
  :root[data-theme="device"] .cbtn{background:#12241F;border-color:#1F4639;color:#7FCFB2;border-radius:3px}
  :root[data-theme="device"] .cbtn.go{background:#0F2A20;border-color:#2C8A64;color:#8CF0C4}
  .cbody{padding:0 9px 8px}
  .csay{font-size:12.5px;line-height:1.55;color:var(--coach-ink);font-weight:500}
  .csay.ok{color:#0B8F66}
  :root[data-theme="device"] .csay.ok{color:#8CF0C4}
  .csay.ng{color:var(--crit)}
  .chint{margin-top:5px;font-size:11.5px;line-height:1.55;color:var(--dim)}
  .cchoices{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .cchoices button{flex:1 1 44%;min-width:120px;text-align:left;padding:8px 11px;border-radius:var(--r-m);
    background:var(--panel);border:2px solid var(--br);font-size:12px;line-height:1.4;color:var(--ink);font-weight:500}
  .cchoices button:hover{border-color:var(--chap)}
  .cchoices button:active{transform:translateY(1px)}
  .cchoices button.ng{border-color:var(--crit);color:var(--crit);opacity:.7}
  :root[data-theme="device"] .cchoices button{background:#0F1B18;border-width:1px;border-color:#1D3B33;color:#CFE6DD}
  .cprog{height:6px;margin-top:7px;background:var(--br);border-radius:999px;overflow:hidden}
  .cprog i{display:block;height:100%;background:linear-gradient(90deg,var(--chap),var(--paw));width:0;
    transition:width .2s linear;border-radius:999px}
  .coach.collapsed .cbody{display:none}
  .coach.cheer{animation:cheer .5s ease-out}
  @keyframes cheer{0%{transform:scale(1)}35%{transform:scale(1.012)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.coach.cheer{animation:none}}
  @media(max-width:620px){
    .cchoices button{flex:1 1 100%}
    .cbar .ct i{display:none}
    .cdots{display:none}
  }

  /* ---- モード／画面切替 ---- */
  .tabs{display:flex;gap:5px;padding:2px 8px 5px;background:transparent;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;padding:6px 14px;border-radius:999px;background:var(--panel);
    border:2px solid var(--br);font-size:12px;font-weight:700;
    letter-spacing:.01em;color:var(--dim)}
  .tabs button:active{transform:translateY(1px)}
  .tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .tabs .sp{flex:1;min-width:8px}
  .tabs .scr[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:#fff}
  :root[data-theme="device"] .tabs{gap:1px;padding:0 6px 4px}
  :root[data-theme="device"] .tabs button{border-radius:3px 3px 0 0;background:var(--key);border:1px solid #0A0E12;
    border-bottom:none;font-family:var(--num);letter-spacing:.04em}
  :root[data-theme="device"] .tabs button[aria-pressed="true"]{background:#0C1319;color:var(--flow);
    box-shadow:inset 0 -2px 0 var(--flow);border-color:#0A0E12}
  :root[data-theme="device"] .tabs .scr[aria-pressed="true"]{background:#0C1319;color:var(--vol);
    box-shadow:inset 0 -2px 0 var(--vol)}

  /* ---- 設定キー ---- */
  .keys{display:flex;gap:6px;padding:3px 8px 6px;overflow-x:auto;scrollbar-width:none;background:transparent}
  .keys::-webkit-scrollbar{display:none}
  .pkey{flex:none;min-width:80px;padding:5px 10px 6px;border-radius:var(--r-m);background:var(--key);
    border:2px solid var(--key-br);box-shadow:0 3px 0 var(--key-lip);text-align:left;color:var(--key-ink);
    transition:transform .06s, box-shadow .06s}
  .pkey:active{transform:translateY(3px);box-shadow:0 0 0 var(--key-lip)}
  .pkey .k{font-size:10px;color:var(--dim);white-space:nowrap;font-weight:700}
  .pkey .v{font-family:var(--num);font-size:20px;font-weight:700;line-height:1.1}
  .pkey .u{font-size:9px;color:var(--faint);margin-left:2px;font-family:var(--num)}
  .pkey[aria-pressed="true"]{background:var(--key-on);border-color:var(--key-on-br);color:var(--key-on-ink)}
  .pkey[aria-pressed="true"] .k{color:var(--key-on-ink)}
  .pkey.pending .v{color:var(--paw);animation:blink 1s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.pkey.pending .v{animation:none}}
  :root[data-theme="device"] .keys{gap:4px;padding:4px 6px;background:var(--body);border-top:1px solid #0A0E12}
  :root[data-theme="device"] .pkey{border-width:1px}
  :root[data-theme="device"] .pkey .k{font-family:var(--num);font-weight:500;letter-spacing:.06em}
  :root[data-theme="device"] .pkey[aria-pressed="true"]{box-shadow:0 0 0 1px var(--flow)}

  /* ---- ハードキー＋ダイヤル ---- */
  .hard{display:flex;align-items:center;gap:6px;padding:4px 8px 6px;
    background:transparent;overflow-x:auto;scrollbar-width:none}
  .hard::-webkit-scrollbar{display:none}
  .hkey{flex:none;padding:8px 12px;border-radius:999px;background:var(--hkey);border:2px solid var(--hkey-br);
    box-shadow:0 3px 0 var(--key-lip);font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--key-ink);
    transition:transform .06s, box-shadow .06s}
  .hkey:active{transform:translateY(3px);box-shadow:0 0 0 var(--key-lip)}
  .hkey.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .hkey.sim{color:var(--accent2);border-color:#D6DEFF}
  .hkey.sim.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  :root[data-theme="device"] .hard{gap:5px;padding:5px 6px;background:var(--bar);border-top:1px solid #0A0E12}
  :root[data-theme="device"] .hkey{border-radius:4px;border-width:1px;font-weight:400}
  :root[data-theme="device"] .hkey.on{background:var(--key);color:var(--flow);border-color:var(--flow)}
  :root[data-theme="device"] .hkey.sim{background:#151A21;color:#8FA8FF;border-color:#1E2836}
  :root[data-theme="device"] .hkey.sim.on{background:#151A21;color:var(--flow);border-color:var(--flow)}
  .dialrow{display:flex;align-items:center;gap:8px;background:var(--bar);border-top:1px solid var(--br);
    padding:7px 9px calc(7px + env(safe-area-inset-bottom,0px))}
