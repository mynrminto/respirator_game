<title>人工呼吸器シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
  :root{
    --chassis:#15181C; --chassis2:#0E1114; --bezel:#23272C;
    --screen:#04070A; --screen2:#080C11;
    --line:#16202A; --line2:#22303D;
    --ink:#DCE6F0; --dim:#7E8EA0; --faint:#4A5765;
    --paw:#F5B429; --flow:#2FD8A8; --vol:#8FA8FF; --spo2:#59D8EA;
    --crit:#FF4B57; --warn:#FFB03A; --good:#3ECB80; --ecg:#4FE07E; --art:#FF6B7A;
    --key:#1B2027; --keyhi:#27303A; --edge:#0A0D10;
    --num:"Barlow Semi Condensed","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
    --jp:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    color-scheme: dark;
  }
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--chassis2);color:var(--ink);font-family:var(--jp);font-size:13px;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:2px solid var(--flow);outline-offset:1px}
  .n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
  .cap{font-family:var(--num);font-size:10px;letter-spacing:.08em;color:var(--dim);font-weight:500}

  /* ============ 筐体 ============ */
  #device{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto auto auto;
    background:linear-gradient(180deg,#1A1E23 0%,#12161A 46%,#0C0F12 100%);
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  /* ---- ステータスバー ---- */
  .status{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--chassis);
    border-bottom:1px solid var(--edge);min-height:36px}
  .brand{display:flex;align-items:baseline;gap:6px;flex:none}
  .brand b{font-family:var(--num);font-size:14px;letter-spacing:.14em;font-weight:700;color:#9FB0C2}
  .brand i{font-style:normal;font-size:9px;letter-spacing:.18em;color:var(--faint);font-family:var(--num)}
  .pt{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
  .alarm{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:26px;padding:0 9px;border-radius:3px;
    background:#0C1116;border:1px solid var(--line2);font-family:var(--num);font-size:12.5px;letter-spacing:.04em;
    color:var(--dim);overflow:hidden;white-space:nowrap}
  .alarm.s1{background:#241B07;border-color:#6A5217;color:#FFCD6B}
  .alarm.s2{background:#2A0C11;border-color:#7E2028;color:#FF98A1;animation:beat 1s steps(1,end) infinite}
  .alarm.muted{opacity:.55;animation:none}
  @keyframes beat{0%,49%{filter:brightness(1)}50%,100%{filter:brightness(1.75)}}
  @media (prefers-reduced-motion:reduce){.alarm.s2{animation:none}}
  .led{width:7px;height:7px;border-radius:50%;flex:none;background:#243040;box-shadow:inset 0 0 2px #000}
  .led.on{background:var(--good);box-shadow:0 0 6px var(--good)}
  .led.s1{background:var(--warn);box-shadow:0 0 7px var(--warn)}
  .led.s2{background:var(--crit);box-shadow:0 0 8px var(--crit)}
  .clk{font-family:var(--num);font-size:15px;font-weight:600;color:#A8B8C8;flex:none}
  @media(max-width:560px){.clk{display:none}.brand i{display:none}.pt{max-width:20vw}
    .val .v{font-size:21px}.hint{display:none}}
  .sil{flex:none;padding:4px 9px;border-radius:3px;background:var(--key);border:1px solid var(--line2);
    font-family:var(--num);font-size:11px;letter-spacing:.06em;color:#B9C6D2}
  .sil.on{background:#2A2413;border-color:#6A5217;color:#FFCD6B}

  /* ---- 画面 ---- */
  .screen{margin:6px;border-radius:5px;background:var(--screen);position:relative;
    border:1px solid #0A1219;box-shadow:inset 0 0 0 1px #000, inset 0 12px 40px rgba(60,120,160,.045);
    display:grid;grid-template-columns:minmax(0,1fr) 216px;min-height:0;overflow:hidden}
  @media(max-width:860px){.screen{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
  .scopewrap{position:relative;min-width:0;min-height:0}
  .scopewrap canvas{display:block;width:100%;height:100%}
  .freeze{position:absolute;left:8px;bottom:6px;font-family:var(--num);font-size:11px;letter-spacing:.14em;
    color:var(--paw);background:#1A1305;border:1px solid #5A4310;padding:2px 8px;border-radius:3px}

  .vals{border-left:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;
    grid-auto-rows:minmax(54px,1fr);gap:1px;background:var(--line);overflow:auto;min-height:0}
  @media(max-width:860px){
    .vals{border-left:none;border-top:1px solid var(--line);grid-template-columns:repeat(4,minmax(86px,1fr));
      overflow-x:auto;grid-auto-flow:column;grid-auto-columns:minmax(84px,1fr);grid-template-rows:1fr 1fr;height:126px}
  }
  .val{background:var(--screen2);padding:4px 7px 5px;min-width:0;position:relative}
  .val .k{font-family:var(--num);font-size:9.5px;letter-spacing:.07em;color:var(--dim);white-space:nowrap}
  .val .v{font-family:var(--num);font-size:clamp(19px,3.4vh,26px);font-weight:600;line-height:1.08;
    font-variant-numeric:tabular-nums}
  .val .u{font-size:8.5px;color:var(--faint);font-family:var(--num);margin-left:2px}
  .val .lim{position:absolute;right:6px;top:4px;font-family:var(--num);font-size:8.5px;color:var(--faint);
    text-align:right;line-height:1.15}
  .val.hi .v{color:var(--crit)} .val.mid .v{color:var(--warn)} .val.ok .v{color:var(--good)}

  /* ---- 学習コースの帯 ---- */
  .coach{background:linear-gradient(180deg,#0D1A17,#0B1512);border-top:1px solid #16342B;
    border-bottom:1px solid var(--edge);flex:none}
  .cbar{display:flex;align-items:center;gap:8px;padding:4px 8px 3px}
  .cbar .ct{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;overflow:hidden}
  .cbar .ct b{font-size:12px;font-weight:600;color:#A8E6CE;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-width:0;flex:1}
  .cbar .ct i{font-style:normal;font-size:10px;color:#4C7566;white-space:nowrap;flex:none}
  .cdots{display:flex;gap:3px;flex:none}
  .cdots span{width:6px;height:6px;border-radius:50%;background:#1B3A31}
  .cdots span.on{background:var(--flow)}
  .cdots span.cur{background:var(--paw);box-shadow:0 0 5px var(--paw)}
  .cbtn{flex:none;padding:3px 8px;border-radius:3px;background:#12241F;border:1px solid #1F4639;
    font-size:11px;color:#7FCFB2}
  .cbtn.go{background:#0F2A20;border-color:#2C8A64;color:#8CF0C4;font-weight:600}
  .cbody{padding:0 8px 7px}
  .csay{font-size:12.5px;line-height:1.5;color:#DCEFE7}
  .csay.ok{color:#8CF0C4}
  .csay.ng{color:#FFB9BE}
  .chint{margin-top:4px;font-size:11.5px;line-height:1.5;color:#5E8A7B}
  .cchoices{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .cchoices button{flex:1 1 44%;min-width:120px;text-align:left;padding:6px 9px;border-radius:4px;
    background:#0F1B18;border:1px solid #1D3B33;font-size:12px;line-height:1.35;color:#CFE6DD}
  .cchoices button:hover{border-color:var(--flow)}
  .cchoices button.ng{border-color:#5A2A30;color:#FF9AA2;opacity:.6}
  .cprog{height:2px;margin-top:6px;background:#16302A;border-radius:1px;overflow:hidden}
  .cprog i{display:block;height:100%;background:var(--flow);width:0;transition:width .2s linear}
  .coach.collapsed .cbody{display:none}
  @media(max-width:560px){
    .cchoices button{flex:1 1 100%}
    .cbar .ct i{display:none}
    .cdots{display:none}
  }
  .lesson{text-align:left;padding:9px 10px;border-radius:4px;background:#0F1318;border:1px solid var(--line);
    display:flex;align-items:center;gap:9px}
  .lesson:hover{border-color:var(--flow)}
  .lesson .lt{flex:1;min-width:0}
  .lesson .lt b{display:block;font-size:12.5px;font-weight:600}
  .lesson .lt span{font-size:11px;color:var(--dim)}
  .chapline{margin:12px 0 6px;font-size:12.5px;font-weight:600;color:#A8E6CE}
  .chapline span{display:block;font-weight:400;font-size:11.5px;color:var(--dim);margin-top:2px}

  /* ---- モード／画面切替 ---- */
  .tabs{display:flex;gap:1px;padding:0 6px 4px;background:transparent;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;padding:6px 13px;border-radius:3px 3px 0 0;background:var(--key);
    border:1px solid var(--edge);border-bottom:none;font-family:var(--num);font-size:12px;font-weight:600;
    letter-spacing:.04em;color:var(--dim)}
  .tabs button[aria-pressed="true"]{background:#0C1319;color:var(--flow);box-shadow:inset 0 -2px 0 var(--flow)}
  .tabs .sp{flex:1;min-width:8px}
  .tabs .scr[aria-pressed="true"]{color:var(--vol);box-shadow:inset 0 -2px 0 var(--vol)}

  /* ---- 設定キー ---- */
  .keys{display:flex;gap:4px;padding:4px 6px;overflow-x:auto;scrollbar-width:none;background:var(--chassis2);
    border-top:1px solid var(--edge)}
  .keys::-webkit-scrollbar{display:none}
  .pkey{flex:none;min-width:78px;padding:4px 8px 5px;border-radius:4px;background:var(--key);
    border:1px solid #0A0E12;box-shadow:0 1px 0 #2B343E inset;text-align:left}
  .pkey .k{font-family:var(--num);font-size:9.5px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
  .pkey .v{font-family:var(--num);font-size:19px;font-weight:600;line-height:1.1}
  .pkey .u{font-size:9px;color:var(--faint);margin-left:2px;font-family:var(--num)}
  .pkey[aria-pressed="true"]{background:var(--keyhi);border-color:var(--flow);box-shadow:0 0 0 1px var(--flow)}
  .pkey.pending .v{color:var(--paw);animation:blink 1s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.pkey.pending .v{animation:none}}

  /* ---- ハードキー＋ダイヤル ---- */
  .hard{display:flex;align-items:center;gap:5px;padding:5px 6px;
    background:var(--chassis);border-top:1px solid var(--edge);overflow-x:auto;scrollbar-width:none}
  .hard::-webkit-scrollbar{display:none}
  .hkey{flex:none;padding:7px 10px;border-radius:4px;background:var(--key);border:1px solid #0A0E12;
    box-shadow:0 1px 0 #2B343E inset;font-size:11.5px;white-space:nowrap;color:#C3D0DC}
  .hkey:active{background:var(--keyhi)}
  .hkey.on{border-color:var(--flow);color:var(--flow)}
  .hkey.sim{background:#151A21;color:#8FA8FF;border-color:#1E2836}
  .dialrow{display:flex;align-items:center;gap:8px;background:var(--chassis2);border-top:1px solid var(--edge);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .dial{flex:1;display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:0}
  .hint{flex:1;min-width:0;font-size:11px;color:var(--faint);line-height:1.4}
  .knob{width:56px;height:56px;border-radius:50%;flex:none;position:relative;touch-action:none;cursor:grab;
    background:radial-gradient(circle at 34% 28%,#39434E 0%,#222A33 42%,#141A20 72%,#0B0F13 100%);
    box-shadow:0 2px 5px #000, inset 0 0 0 1px #3A454F, inset 0 -3px 6px #000}
  .knob:active{cursor:grabbing}
  .knob canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
  .dialbox{min-width:92px}
  .dialbox .k{font-family:var(--num);font-size:9.5px;letter-spacing:.06em;color:var(--dim)}
  .dialbox .v{font-family:var(--num);font-size:24px;font-weight:700;line-height:1.05;color:#D8E4F0}
  .dialrow.pending .dialbox .v{color:var(--paw)}
  .dialbox .u{font-size:9px;color:var(--faint);margin-left:2px}
  .ok{flex:none;padding:9px 12px;border-radius:4px;background:#0F2A20;border:1px solid #1E6B4E;color:#6BE3AF;
    font-family:var(--num);font-size:12.5px;font-weight:600;letter-spacing:.06em}
  .ok[disabled]{opacity:.32;pointer-events:none}

  /* ---- 早送り帯 ---- */
  .ff{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:var(--num);font-size:11px;
    letter-spacing:.16em;color:#0B0F12;background:var(--paw);padding:2px 10px;border-radius:2px}

  /* ============ ダイアログ ============ */
  .modal{position:fixed;inset:0;z-index:80;background:#02040699;display:flex;align-items:center;justify-content:center;padding:12px}
  .mbox{background:linear-gradient(180deg,#171B20,#0E1216);border:1px solid var(--bezel);border-radius:6px;
    width:min(680px,100%);max-height:90%;overflow:auto;box-shadow:0 20px 60px #000}
  .mhead{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#171B20;
    border-bottom:1px solid var(--edge)}
  .mhead h3{margin:0;font-size:14px;font-weight:600;flex:1}
  .mhead button{padding:5px 10px;border-radius:3px;background:var(--key);border:1px solid var(--line2);font-size:12px}
  .mbody{padding:12px}
  .mbody p{margin:0 0 10px;color:var(--dim);font-size:12.5px;line-height:1.6}
  .grid2{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .row{display:flex;align-items:center;gap:8px;padding:7px 9px;background:#0F1318;border:1px solid var(--line);
    border-radius:4px;font-size:12.5px}
  .row .rv{margin-left:auto;font-family:var(--num);color:var(--dim)}
  .mk{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:11px;font-family:var(--num);flex:none}
  .mk.y{background:#0F2A20;color:var(--good)} .mk.n{background:#2A1216;color:var(--crit)}
  .abg{width:100%;border-collapse:collapse;font-size:12.5px}
  .abg td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .abg td:first-child{color:var(--dim)}
  .abg td:nth-child(2){font-family:var(--num);font-size:18px;font-weight:600;text-align:right}
  .abg td:last-child{font-size:10.5px;color:var(--faint);text-align:right}
  .bad{color:var(--crit)} .goodv{color:var(--good)}
  .note{font-size:11.5px;color:var(--faint);line-height:1.6}
  .tip{font-size:12px;padding:8px 10px;border-radius:4px;background:#0B1A16;border:1px solid #17392F;color:#8FE0C2;margin-top:8px}
  .tip.bad{background:#1B0F12;border-color:#40202A;color:#FFAEB5}
  .mbtn{padding:9px 14px;border-radius:4px;background:var(--key);border:1px solid var(--line2);font-size:12.5px}
  .mbtn.go{background:#0F2A20;border-color:#1E6B4E;color:#6BE3AF;font-weight:600}
  .mbtn.warn{border-color:#5A2A30;color:#FF9AA2}
  .mrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .case{text-align:left;padding:10px;border-radius:4px;background:#0F1318;border:1px solid var(--line);
    display:flex;flex-direction:column;gap:3px}
  .case:hover{border-color:var(--flow)}
  .case b{font-size:13px} .case span{font-size:11.5px;color:var(--dim)}
  .case i{font-style:normal;font-family:var(--num);font-size:9.5px;letter-spacing:.1em;color:var(--faint)}
  .score{font-family:var(--num);font-size:46px;font-weight:700;line-height:1}
  canvas.chart{width:100%;height:160px;display:block;background:#0A0E12;border:1px solid var(--line);border-radius:4px;margin-top:8px}
</style>

<div id="device">
  <div class="status">
    <div class="brand"><b>VENTA</b><i>SIM 5000</i></div>
    <span class="led on" id="ledPwr" title="運転中"></span>
    <div class="pt" id="ptName">—</div>
    <div class="alarm" id="alarm"><span class="led" id="ledAlarm"></span><span id="alarmTxt">起動中</span></div>
    <button class="sil" id="btnSil">消音 2分</button>
    <div class="clk" id="clk">08:00</div>
  </div>

  <div class="screen">
    <div class="scopewrap" id="scopewrap">
      <canvas id="scope"></canvas>
      <div class="ff" id="ff" hidden>早送り中</div>
      <div class="freeze" id="frz" hidden>波形停止中</div>
    </div>
    <div class="vals" id="vals"></div>
  </div>

  <div class="coach" id="coach" hidden>
    <div class="cbar">
      <button class="cbtn" id="cToggle" aria-label="解説の表示を切り替える">▾</button>
      <div class="ct"><b id="cTitle">—</b><i id="cChap"></i></div>
      <div class="cdots" id="cDots"></div>
      <button class="cbtn" id="cBrief">解説</button>
      <button class="cbtn" id="cQuit">終了</button>
    </div>
    <div class="cbody">
      <div class="csay" id="cSay">—</div>
      <div class="chint" id="cHint" hidden></div>
      <div class="cchoices" id="cChoices" hidden></div>
      <div class="cprog" id="cProg" hidden><i id="cProgBar"></i></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="keys" id="keys"></div>

  <div class="hard">
    <button class="hkey" id="kInsp">吸気ポーズ</button>
    <button class="hkey" id="kExp">呼気ポーズ</button>
    <button class="hkey" id="kO2">100% O₂</button>
    <button class="hkey" id="kSuc">気管吸引</button>
    <button class="hkey" id="kFrz">波形停止</button>
    <button class="hkey sim" id="kSpd">× 1</button>
    <button class="hkey sim" id="kAbg">血液ガス</button>
    <button class="hkey sim" id="kWean">離脱</button>
    <button class="hkey sim" id="kLearn">学習コース</button>
    <button class="hkey sim" id="kMenu">メニュー</button>
  </div>

  <div class="dialrow">
    <div class="hint">設定キーを押し、ダイヤルを回して「確定」で反映します。</div>
    <div class="dial">
      <div class="dialbox">
        <div class="k" id="dialK">設定を選択</div>
        <div class="v"><span id="dialV">—</span><span class="u" id="dialU"></span></div>
      </div>
      <div class="knob" id="knob" role="slider" tabindex="0" aria-label="設定ダイヤル"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><canvas id="knobC"></canvas></div>
      <button class="ok" id="btnOk" disabled>確定</button>
    </div>
  </div>
</div>

<div id="modals"></div>

<script src="engine.js"></script>
<script src="scenarios.js"></script>
<script src="lessons.js"></script>
<script src="app.js"></script>
