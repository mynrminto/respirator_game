# XcodeGen 用の定義。
#
# ふだんは使いません。VentilatorSim.xcodeproj がそのまま開けるので、
# Xcode でそれを開いて Run すれば動きます。
#
# .xcodeproj が壊れた・Xcode のバージョンが合わなくて開けない、というときだけ
#   brew install xcodegen
#   cd swift && xcodegen generate
# で作り直してください。同じ名前の .xcodeproj を上書きします。

name: VentilatorSim
options:
  bundleIdPrefix: com.mynrminto
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  VentilatorCore:
    path: VentilatorSim

targets:
  VentaSim:
    type: application
    platform: iOS
    sources:
      - path: VentilatorSim/App
      # Web 版と同じ画像を、フォルダのまま Bundle.main/assets に入れる
      - path: ../web/assets
        type: folder
    dependencies:
      - package: VentilatorCore
        product: VentilatorCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: VentaSim
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: VentaSim
        PRODUCT_BUNDLE_IDENTIFIER: com.mynrminto.VentaSim
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
